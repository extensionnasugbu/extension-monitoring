      livePayload=payload; const maps=yearMaps(payload); liveYears=Object.keys(maps).map(Number).sort((a,b)=>a-b);
      if(!liveYears.length)throw new Error('No annual REF_* sheets were found. Expected names such as REF_CICS_2026.');
      const current=+document.getElementById('yr').value;
      const keepC=st.c, keepP=st.p;
       const liveYear=liveYears.includes(current)?current:liveYears[liveYears.length-1];
       const selectedPeriod=periodsIndex().find(p=>p.key===st.per);
       const keepQ=(selectedPeriod&&selectedPeriod.live&&selectedPeriod.year===liveYear)?selectedPeriod.quarter:null;
       loadLiveYear(liveYear,keepQ);
       if(keepC==='ALL'||DB.cols[keepC]){st.c=keepC;if(keepC==='ALL'){st.p='ALL'}else{const ps=new Set(DB.cols[keepC].acts.map(a=>a.prog));st.p=(keepP==='ALL'||ps.has(keepP))?keepP:'ALL'}fillFilters();render();}
      statusEl.textContent='● LIVE GOOGLE SHEET';
      statusEl.title='Dashboard data is loaded directly from Google Sheets. Last refresh: '+new Date().toLocaleString();
    }catch(err){
      console.error('Google Sheet live refresh failed:',err);
      statusEl.textContent='● GOOGLE SHEET CONNECTION ERROR';
      srcEl.textContent=err.message;
      document.getElementById('view').innerHTML='<div style="padding:16px;border:1px solid #b4472f;border-radius:10px;background:#fff"><b>Live data could not be loaded.</b><br>'+esc(err.message)+'</div>';
    }
  }
  document.getElementById('yr').onchange=e=>loadLiveYear(+e.target.value);
  document.getElementById('qr').onchange=e=>{
    const m=String(e.target.value||'').match(/^live-(\d{4})-(Q[1-4])$/);
    if(m) loadLiveYear(+m[1],m[2]);
  };
  await refreshLive();
  // Refresh automatically every 60 seconds while the dashboard is open.
  setInterval(refreshLive,60000);
})();
</script><div id="cardDialogBackdrop" class="card-dialog-backdrop" aria-hidden="true">
  <div class="card-dialog" role="dialog" aria-modal="true" aria-labelledby="cardDialogTitle">
    <div class="card-dialog-head">
      <b id="cardDialogTitle">Details</b>
      <button type="button" class="card-dialog-close" aria-label="Close">&times;</button>
    </div>
    <div id="cardDialogBody" class="card-dialog-body"></div>
  </div>
</div>

<script>
(function(){
  const backdrop=document.getElementById('cardDialogBackdrop');
  const title=document.getElementById('cardDialogTitle');
  const body=document.getElementById('cardDialogBody');
  if(!backdrop||!title||!body)return;

  function closeDialog(){
    backdrop.classList.remove('open');
    backdrop.setAttribute('aria-hidden','true');
    document.body.classList.remove('dialog-open');
  }
  function openCard(card){
    const label=(card.querySelector('.kh b')||{}).textContent||'Details';
    const nativeTip=card.getAttribute('title')||'';
    const drill=card.querySelector('.act-hover-tip');
    const isProjects=/^Projects Completed$/i.test(label.trim());
    const isPrograms=/^Programs Conducted$/i.test(label.trim());
    const isActivities=/^Activities Implemented$/i.test(label.trim());
    const cardCount=(card.querySelector('.kv')||{}).textContent||'';
    title.textContent=isProjects?`Projects Status${cardCount?' — '+cardCount.trim()+' Completed':''}`:isPrograms?`Programs Status${cardCount?' — '+cardCount.trim()+' Conducted':''}`:isActivities?`Activities Status${cardCount?' — '+cardCount.trim()+' Implemented':''}`:label.trim();
    body.innerHTML='';
    if(nativeTip && !isProjects){
      const s=document.createElement('div');
      s.className='card-dialog-summary';
      s.textContent=nativeTip;
      body.appendChild(s);
    }
    if(drill) body.appendChild(drill.cloneNode(true));
    if(!nativeTip && !drill){
      const s=document.createElement('div');
      s.className='card-dialog-summary';
      s.textContent='No additional details are available for this card.';
      body.appendChild(s);
    }
    backdrop.classList.add('open');
    backdrop.setAttribute('aria-hidden','false');
    document.body.classList.add('dialog-open');
  }

  document.addEventListener('click',function(e){
    const sdgTrack=e.target.closest('.sdg-rank-track.sdg-clickable');
    if(sdgTrack){
      e.preventDefault();
      const n=sdgTrack.getAttribute('data-sdg'), count=sdgTrack.getAttribute('data-count')||'0';
      const tip=sdgTrack.querySelector('.sdg-tip');
      title.textContent=`SDG ${n} — ${SDG_META[+n]?SDG_META[+n][0]:'Activity Details'} (${count} Activit${count==='1'?'y':'ies'})`;
      body.innerHTML='';
      if(tip){ const clone=tip.cloneNode(true); clone.style.display='block'; clone.style.position='static'; clone.style.width='auto'; clone.style.maxHeight='none'; clone.style.boxShadow='none'; clone.style.border='0'; clone.style.padding='0'; body.appendChild(clone); }
      backdrop.classList.add('open'); backdrop.setAttribute('aria-hidden','false'); document.body.classList.add('dialog-open');
      return;
    }
    const card=e.target.closest('.kc');
    if(card){
      e.preventDefault();
      openCard(card);
      return;
    }
    if(e.target===backdrop || e.target.closest('.card-dialog-close')) closeDialog();
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDialog(); });
})();
</script>
